<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тест мини-аппа с логами</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #0f0;
      font-family: monospace;
    }
    #logs {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 200px;
      background: rgba(0,0,0,0.9);
      border-bottom: 2px solid #0f0;
      overflow-y: auto;
      padding: 10px;
      z-index: 9999;
      font-size: 12px;
    }
    #frame {
      margin-top: 200px;
      width: 100%;
      height: calc(100vh - 200px);
      border: none;
    }
    .log { margin: 5px 0; }
    .log.info { color: #0ff; }
    .log.success { color: #0f0; }
    .log.error { color: #f00; }
  </style>
</head>
<body>
  <div id="logs">
    <div class="log success">🚀 Логи будут появляться здесь...</div>
    <div class="log info">📝 Открой мини-апп ниже и делай действия</div>
  </div>
  <iframe id="frame" src="https://web-production-fc84.up.railway.app"></iframe>

  <script>
    const logsDiv = document.getElementById('logs');
    
    // Перехватываем console.log из iframe
    const originalLog = console.log;
    const originalError = console.error;
    const originalWarn = console.warn;
    
    function addLog(message, type = 'info') {
      const logDiv = document.createElement('div');
      logDiv.className = `log ${type}`;
      logDiv.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logsDiv.appendChild(logDiv);
      logsDiv.scrollTop = logsDiv.scrollHeight;
    }
    
    console.log = function(...args) {
      addLog(args.join(' '), 'info');
      originalLog.apply(console, args);
    };
    
    console.error = function(...args) {
      addLog(args.join(' '), 'error');
      originalError.apply(console, args);
    };
    
    console.warn = function(...args) {
      addLog(args.join(' '), 'info');
      originalWarn.apply(console, args);
    };
    
    // Слушаем сообщения от iframe
    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'log') {
        addLog(event.data.message, event.data.level || 'info');
      }
    });
    
    addLog('✅ Страница загружена. Жди загрузки мини-аппа...', 'success');
  </script>
</body>
</html>
